<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <h1>Add User</h1>
    <form action="" method="post">
        {% csrf_token %}

        <!-- Converts that memory object into HTML tags (<input>) so the user can see them.-->
        {{form.as_p}} <!-- This will display all the fields of the form -->
        <!--It looks at your UsersForm class (fields=['username', 'email', ...])
       and generates the matching HTML for each one. -->
        <button type="submit">Add User</button>
    </form>
    <a href="/login/">Login</a>
    <a href="/add_patient/">Add Patient</a>
    <a href="/admin/">Admin</a>
</body>

</html>
